[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "g-api-view"
dynamic = ["version"]
description = "Клиент ApiServerG: доступ к Google Gemini по API-ключу"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Viktor3911" }]
keywords = ["gemini", "api", "client", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic-settings>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/Viktor3911/ApiClientG"
Repository = "https://github.com/Viktor3911/ApiClientG"
Issues = "https://github.com/Viktor3911/ApiClientG/issues"
Changelog = "https://github.com/Viktor3911/ApiClientG/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "g_api_view/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["g_api_view"]

[tool.hatch.build.targets.sdist]
include = ["g_api_view", "tests", "README.md", "CHANGELOG.md", "LICENSE", "example.py"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
